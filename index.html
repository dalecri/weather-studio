<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric Voxel Weather Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0f172a;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .weather-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .weather-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            color: white;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 6px;
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #60a5fa;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.8);
        }
    </style>
</head>
<body class="text-slate-100">

    <!-- Top Header & Telemetry -->
    <div class="fixed top-4 left-4 right-4 z-10 flex flex-wrap items-center justify-between gap-4 pointer-events-none">
        <div class="glass-panel px-5 py-3.5 rounded-2xl pointer-events-auto flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-base sm:text-lg tracking-tight leading-none text-white">Voxel Weather Studio</h1>
                <p class="text-xs text-slate-400 mt-1">Drag to rotate • Scroll to zoom • Click lightning</p>
            </div>
        </div>

        <!-- Environment Sliders -->
        <div class="glass-panel px-5 py-3 rounded-2xl pointer-events-auto flex flex-wrap items-center gap-5 text-xs">
            <div class="flex flex-col gap-1.5 w-28 sm:w-32">
                <div class="flex justify-between text-slate-300 font-medium">
                    <span>Wind X</span>
                    <span id="wind-val" class="text-blue-400">0.4</span>
                </div>
                <input id="wind-slider" type="range" min="-2.0" max="2.0" step="0.1" value="0.4">
            </div>

            <div class="flex flex-col gap-1.5 w-28 sm:w-32">
                <div class="flex justify-between text-slate-300 font-medium">
                    <span>Intensity</span>
                    <span id="intensity-val" class="text-blue-400">100%</span>
                </div>
                <input id="intensity-slider" type="range" min="0.2" max="2.0" step="0.1" value="1.0">
            </div>

            <button id="strike-btn" class="px-3.5 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-amber-300 font-semibold transition flex items-center gap-1.5 active:scale-95">
                <span>⚡</span> Strike
            </button>
        </div>
    </div>

    <!-- Bottom Weather Selector Bar -->
    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-10 w-[95%] max-w-3xl pointer-events-none">
        <div class="glass-panel p-2 rounded-2xl pointer-events-auto grid grid-cols-3 sm:grid-cols-6 gap-2">
            <button data-weather="sunny" class="weather-btn px-3 py-2.5 rounded-xl border border-white/10 bg-slate-800/60 hover:bg-slate-700/70 flex flex-col items-center gap-1 text-xs font-medium">
                <span class="text-lg">☀️</span>
                <span>Sunny</span>
            </button>
            <button data-weather="rain" class="weather-btn active px-3 py-2.5 rounded-xl border border-white/10 bg-slate-800/60 hover:bg-slate-700/70 flex flex-col items-center gap-1 text-xs font-medium">
                <span class="text-lg">🌧️</span>
                <span>Rain</span>
            </button>
            <button data-weather="storm" class="weather-btn px-3 py-2.5 rounded-xl border border-white/10 bg-slate-800/60 hover:bg-slate-700/70 flex flex-col items-center gap-1 text-xs font-medium">
                <span class="text-lg">⛈️</span>
                <span>Storm</span>
            </button>
            <button data-weather="snow" class="weather-btn px-3 py-2.5 rounded-xl border border-white/10 bg-slate-800/60 hover:bg-slate-700/70 flex flex-col items-center gap-1 text-xs font-medium">
                <span class="text-lg">❄️</span>
                <span>Snow</span>
            </button>
            <button data-weather="sakura" class="weather-btn px-3 py-2.5 rounded-xl border border-white/10 bg-slate-800/60 hover:bg-slate-700/70 flex flex-col items-center gap-1 text-xs font-medium">
                <span class="text-lg">🌸</span>
                <span>Sakura</span>
            </button>
            <button data-weather="fireflies" class="weather-btn px-3 py-2.5 rounded-xl border border-white/10 bg-slate-800/60 hover:bg-slate-700/70 flex flex-col items-center gap-1 text-xs font-medium">
                <span class="text-lg">✨</span>
                <span>Fireflies</span>
            </button>
        </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let worldGroup, voxelRoomGroup, cloudGroup;
        let ambientLight, dirLight, windowLight, lampLight, lightningLight;
        let snowCaps = [];
        let waterMaterial, foliageMaterials = [];

        // Camera spherical/isometric control state
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        let targetAzimuth = Math.PI / 4;
        let currentAzimuth = Math.PI / 4;
        let targetElevation = Math.PI / 5.2;
        let currentElevation = Math.PI / 5.2;
        let targetZoom = 1.05;
        let currentZoom = 1.05;
        const frustumSize = 28;

        // Weather state
        let currentWeather = 'rain';
        let windX = 0.4;
        let weatherIntensity = 1.0;
        let snowAccumulation = 0; // 0 to 1
        let lightningFlash = 0;
        let lightningBoltMesh = null;

        // Particle pools
        const MAX_PARTICLES = 600;
        let rainSystem, snowSystem, sakuraSystem, fireflySystem, splashSystem;

        // Weather color & light presets
        const WEATHER_PRESETS = {
            sunny: {
                bg: new THREE.Color(0x38bdf8),
                ambientColor: new THREE.Color(0xffffff),
                ambientIntensity: 0.72,
                dirColor: new THREE.Color(0xfffbeb),
                dirIntensity: 1.15,
                windowGlow: 0.15,
                foliageColor: new THREE.Color(0x4ade80),
                cloudColor: new THREE.Color(0xffffff),
                cloudOpacity: 0.85
            },
            rain: {
                bg: new THREE.Color(0x1e293b),
                ambientColor: new THREE.Color(0x94a3b8),
                ambientIntensity: 0.55,
                dirColor: new THREE.Color(0x64748b),
                dirIntensity: 0.45,
                windowGlow: 1.4,
                foliageColor: new THREE.Color(0x22c55e),
                cloudColor: new THREE.Color(0x64748b),
                cloudOpacity: 0.95
            },
            storm: {
                bg: new THREE.Color(0x090d16),
                ambientColor: new THREE.Color(0x475569),
                ambientIntensity: 0.32,
                dirColor: new THREE.Color(0x334155),
                dirIntensity: 0.25,
                windowGlow: 2.0,
                foliageColor: new THREE.Color(0x15803d),
                cloudColor: new THREE.Color(0x334155),
                cloudOpacity: 0.98
            },
            snow: {
                bg: new THREE.Color(0x334155),
                ambientColor: new THREE.Color(0xe2e8f0),
                ambientIntensity: 0.78,
                dirColor: new THREE.Color(0xf8fafc),
                dirIntensity: 0.65,
                windowGlow: 1.6,
                foliageColor: new THREE.Color(0x86efac),
                cloudColor: new THREE.Color(0xe2e8f0),
                cloudOpacity: 0.9
            },
            sakura: {
                bg: new THREE.Color(0x4c1d95),
                ambientColor: new THREE.Color(0xfbcfe8),
                ambientIntensity: 0.68,
                dirColor: new THREE.Color(0xfde047),
                dirIntensity: 0.85,
                windowGlow: 1.1,
                foliageColor: new THREE.Color(0xf472b6),
                cloudColor: new THREE.Color(0xfce7f3),
                cloudOpacity: 0.85
            },
            fireflies: {
                bg: new THREE.Color(0x060913),
                ambientColor: new THREE.Color(0x312e81),
                ambientIntensity: 0.35,
                dirColor: new THREE.Color(0x818cf8),
                dirIntensity: 0.28,
                windowGlow: 2.1,
                foliageColor: new THREE.Color(0x166534),
                cloudColor: new THREE.Color(0x1e1b4b),
                cloudOpacity: 0.6
            }
        };

        // Shared unit voxel geometry
        const unitBoxGeo = new THREE.BoxGeometry(1, 1, 1);

        function createVoxel(x, y, z, w, h, d, color, options = {}) {
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: options.roughness !== undefined ? options.roughness : 0.75,
                metalness: options.metalness !== undefined ? options.metalness : 0.05,
                transparent: options.transparent || false,
                opacity: options.opacity !== undefined ? options.opacity : 1.0,
                emissive: options.emissive ? new THREE.Color(options.emissive) : new THREE.Color(0x000000),
                emissiveIntensity: options.emissiveIntensity || 0
            });

            const mesh = new THREE.Mesh(unitBoxGeo, mat);
            mesh.scale.set(w, h, d);
            mesh.position.set(x, y, z);
            mesh.castShadow = options.castShadow !== undefined ? options.castShadow : true;
            mesh.receiveShadow = options.receiveShadow !== undefined ? options.receiveShadow : true;
            voxelRoomGroup.add(mesh);

            if (options.snowCap) {
                const capMat = new THREE.MeshStandardMaterial({
                    color: 0xf8fafc,
                    roughness: 0.9,
                    transparent: true,
                    opacity: 0
                });
                const cap = new THREE.Mesh(unitBoxGeo, capMat);
                cap.scale.set(w * 0.98, 0.01, d * 0.98);
                cap.position.set(x, y + h / 2 + 0.01, z);
                cap.receiveShadow = true;
                voxelRoomGroup.add(cap);
                snowCaps.push({ mesh: cap, baseY: y + h / 2 });
            }

            if (options.isFoliage) {
                foliageMaterials.push(mat);
            }

            return mesh;
        }

        function buildVoxelDiorama() {
            voxelRoomGroup = new THREE.Group();
            worldGroup.add(voxelRoomGroup);

            // 1. Cutaway Diorama Base & Earth Layers
            createVoxel(0, -1.2, 0, 16.4, 1.2, 16.4, 0x334155); // Deep stone base
            createVoxel(0, -0.35, 0, 16, 0.7, 16, 0x78350f);   // Rich soil layer
            createVoxel(0, 0.15, 0, 16, 0.3, 16, 0x4ade80, { snowCap: true }); // Grass top surface

            // 2. Cutaway Back Walls (Left X=-7.6, Back Z=-7.6)
            createVoxel(-7.6, 4.3, -0.2, 0.8, 8.0, 15.6, 0xe2e8f0, { snowCap: true });
            createVoxel(0.2, 4.3, -7.6, 15.6, 8.0, 0.8, 0xcbd5e1, { snowCap: true });

            // Wooden interior wainscoting & raised cozy floor
            createVoxel(-2.2, 0.45, -2.2, 10.2, 0.35, 10.2, 0x9a3412); // Indoor oak floor

            // 3. Large Glowing Isometric Window in Back Wall
            windowMesh = createVoxel(-1.5, 4.5, -7.15, 5.2, 3.6, 0.25, 0xfef08a, {
                emissive: 0xf59e0b,
                emissiveIntensity: 1.4,
                roughness: 0.2
            });
            // Window frames
            createVoxel(-1.5, 6.3, -7.05, 5.6, 0.25, 0.4, 0x475569, { snowCap: true });
            createVoxel(-1.5, 2.7, -7.05, 5.6, 0.3, 0.5, 0x475569, { snowCap: true });
            createVoxel(-1.5, 4.5, -7.05, 0.2, 3.6, 0.35, 0x475569);

            // 4. Slanted/Stepped Voxel Roof Overhang
            for (let i = 0; i < 4; i++) {
                createVoxel(-2.0, 8.5 + i * 0.45, -4.2 - i * 0.7, 11.4, 0.45, 7.2 - i * 1.2, 0xbe123c, { snowCap: true });
            }

            // Chimney with warm brick tones
            createVoxel(-5.5, 9.8, -5.5, 1.8, 3.2, 1.8, 0x991b1b, { snowCap: true });
            createVoxel(-5.5, 11.4, -5.5, 2.1, 0.35, 2.1, 0x7f1d1d, { snowCap: true });

            // 5. Cozy Interior Desk, Monitor & Bookshelf (Rooms style)
            // Desk
            createVoxel(-5.4, 1.9, -3.5, 2.4, 0.25, 4.6, 0xd97706);
            createVoxel(-6.3, 1.1, -5.4, 0.3, 1.4, 0.3, 0x334155);
            createVoxel(-4.5, 1.1, -5.4, 0.3, 1.4, 0.3, 0x334155);
            createVoxel(-6.3, 1.1, -1.6, 0.3, 1.4, 0.3, 0x334155);
            createVoxel(-4.5, 1.1, -1.6, 0.3, 1.4, 0.3, 0x334155);

            // Glowing Dual Voxel Monitors
            createVoxel(-5.8, 2.8, -3.5, 0.2, 1.2, 2.1, 0x1e293b);
            createVoxel(-5.68, 2.8, -3.5, 0.08, 1.0, 1.9, 0x38bdf8, {
                emissive: 0x38bdf8,
                emissiveIntensity: 0.9
            });

            // Cozy Bed on the right side of the room
            createVoxel(0.8, 1.1, -4.8, 3.6, 0.9, 4.4, 0x78350f); // Bed frame
            createVoxel(0.8, 1.65, -4.6, 3.3, 0.45, 4.0, 0xf8fafc); // Mattress
            createVoxel(0.8, 1.72, -3.9, 3.35, 0.48, 2.6, 0x3b82f6); // Blanket
            createVoxel(0.8, 2.0, -5.9, 2.4, 0.35, 0.9, 0xe2e8f0);  // Pillow

            // 6. Outdoor Garden Pond & Stepping Stones
            // Pond Basin
            createVoxel(4.2, 0.18, 3.8, 5.4, 0.35, 5.2, 0x64748b, { snowCap: true });
            waterMaterial = new THREE.MeshStandardMaterial({
                color: 0x0ea5e9,
                roughness: 0.15,
                metalness: 0.3,
                transparent: true,
                opacity: 0.85
            });
            const waterMesh = new THREE.Mesh(unitBoxGeo, waterMaterial);
            waterMesh.scale.set(4.8, 0.36, 4.6);
            waterMesh.position.set(4.2, 0.22, 3.8);
            waterMesh.receiveShadow = true;
            voxelRoomGroup.add(waterMesh);

            // Stepping stones
            createVoxel(0.2, 0.33, 3.5, 1.2, 0.15, 1.2, 0x94a3b8, { snowCap: true });
            createVoxel(-1.5, 0.33, 4.5, 1.1, 0.15, 1.1, 0x94a3b8, { snowCap: true });
            createVoxel(-3.2, 0.33, 5.2, 1.3, 0.15, 1.2, 0x94a3b8, { snowCap: true });

            // 7. Voxel Tree (Changes foliage in Sakura/Snow/Sunny modes)
            // Trunk
            createVoxel(4.8, 2.2, -2.5, 1.1, 3.8, 1.1, 0x5c4033);
            // Layered Voxel Canopy
            createVoxel(4.8, 4.5, -2.5, 4.2, 1.6, 4.2, 0x4ade80, { snowCap: true, isFoliage: true });
            createVoxel(4.8, 5.8, -2.5, 3.2, 1.4, 3.2, 0x22c55e, { snowCap: true, isFoliage: true });
            createVoxel(4.8, 6.8, -2.5, 2.0, 1.0, 2.0, 0x4ade80, { snowCap: true, isFoliage: true });

            // 8. Warm Street Lantern in Courtyard
            createVoxel(-5.2, 1.8, 5.2, 0.35, 3.2, 0.35, 0x1e293b);
            createVoxel(-5.2, 3.6, 5.2, 0.9, 0.9, 0.9, 0xfef08a, {
                emissive: 0xf59e0b,
                emissiveIntensity: 1.8,
                snowCap: true
            });
        }

        const clouds = [];
        function buildVoxelClouds() {
            cloudGroup = new THREE.Group();
            worldGroup.add(cloudGroup);

            const cloudConfigs = [
                { x: -4, y: 13.5, z: -2, scale: 1.1, speed: 0.7 },
                { x: 3.5, y: 14.8, z: 2.5, scale: 0.9, speed: 0.95 },
                { x: -1, y: 12.8, z: 4.5, scale: 0.75, speed: 0.6 }
            ];

            cloudConfigs.forEach(cfg => {
                const cHolder = new THREE.Group();
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    roughness: 0.95,
                    transparent: true,
                    opacity: 0.9
                });

                const parts = [
                    [0, 0, 0, 3.4, 1.1, 2.2],
                    [-1.2, 0.4, 0, 1.8, 1.0, 1.6],
                    [0.9, 0.5, 0.2, 2.0, 1.1, 1.8],
                    [0, -0.2, 0.8, 2.4, 0.8, 1.4]
                ];

                parts.forEach(p => {
                    const m = new THREE.Mesh(unitBoxGeo, mat);
                    m.scale.set(p[3] * cfg.scale, p[4] * cfg.scale, p[5] * cfg.scale);
                    m.position.set(p[0] * cfg.scale, p[1] * cfg.scale, p[2] * cfg.scale);
                    m.castShadow = true;
                    cHolder.add(m);
                });

                cHolder.position.set(cfg.x, cfg.y, cfg.z);
                cloudGroup.add(cHolder);
                clouds.push({ group: cHolder, material: mat, baseZ: cfg.z, baseY: cfg.y, speed: cfg.speed });
            });
        }

        function initWeatherSystems() {
            const dummy = new THREE.Object3D();

            // 1. RAIN SYSTEM (Slanted Voxel Streaks)
            const rainMat = new THREE.MeshBasicMaterial({
                color: 0x93c5fd,
                transparent: true,
                opacity: 0.75
            });
            rainSystem = new THREE.InstancedMesh(unitBoxGeo, rainMat, MAX_PARTICLES);
            rainSystem.userData.particles = [];
            for (let i = 0; i < MAX_PARTICLES; i++) {
                rainSystem.userData.particles.push({
                    x: (Math.random() - 0.5) * 16,
                    y: Math.random() * 15,
                    z: (Math.random() - 0.5) * 16,
                    speed: 16 + Math.random() * 6
                });
                dummy.scale.set(0, 0, 0);
                dummy.updateMatrix();
                rainSystem.setMatrixAt(i, dummy.matrix);
            }
            worldGroup.add(rainSystem);

            // 2. RAIN SPLASH RINGS ON THE GROUND & POND
            const splashGeo = new THREE.BoxGeometry(1, 0.08, 1);
            const splashMat = new THREE.MeshBasicMaterial({
                color: 0xe0f2fe,
                transparent: true,
                opacity: 0.65
            });
            splashSystem = new THREE.InstancedMesh(splashGeo, splashMat, 120);
            splashSystem.userData.splashes = [];
            for (let i = 0; i < 120; i++) {
                splashSystem.userData.splashes.push({
                    x: (Math.random() - 0.5) * 14,
                    y: 0.35,
                    z: (Math.random() - 0.5) * 14,
                    progress: Math.random()
                });
            }
            worldGroup.add(splashSystem);

            // 3. SNOW SYSTEM (Tumbling Voxel Cubes)
            const snowMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.9,
                emissive: 0x94a3b8,
                emissiveIntensity: 0.2
            });
            snowSystem = new THREE.InstancedMesh(unitBoxGeo, snowMat, MAX_PARTICLES);
            snowSystem.userData.particles = [];
            for (let i = 0; i < MAX_PARTICLES; i++) {
                snowSystem.userData.particles.push({
                    x: (Math.random() - 0.5) * 16,
                    y: Math.random() * 15,
                    z: (Math.random() - 0.5) * 16,
                    speed: 2.2 + Math.random() * 1.8,
                    phase: Math.random() * Math.PI * 2,
                    size: 0.12 + Math.random() * 0.14
                });
                dummy.scale.set(0, 0, 0);
                dummy.updateMatrix();
                snowSystem.setMatrixAt(i, dummy.matrix);
            }
            worldGroup.add(snowSystem);

            // 4. SAKURA PETALS SYSTEM (Fluttering Pink Voxel Tiles)
            const sakuraMat = new THREE.MeshStandardMaterial({
                color: 0xf9a8d4,
                emissive: 0xf472b6,
                emissiveIntensity: 0.25,
                roughness: 0.6
            });
            sakuraSystem = new THREE.InstancedMesh(unitBoxGeo, sakuraMat, 350);
            sakuraSystem.userData.particles = [];
            for (let i = 0; i < 350; i++) {
                sakuraSystem.userData.particles.push({
                    x: (Math.random() - 0.5) * 16,
                    y: Math.random() * 15,
                    z: (Math.random() - 0.5) * 16,
                    speed: 1.6 + Math.random() * 1.2,
                    phase: Math.random() * Math.PI * 2,
                    rotSpeed: 1.5 + Math.random() * 2.5
                });
                dummy.scale.set(0, 0, 0);
                dummy.updateMatrix();
                sakuraSystem.setMatrixAt(i, dummy.matrix);
            }
            worldGroup.add(sakuraSystem);

            // 5. FIREFLIES SYSTEM (Floating Glowing Voxels)
            const fireflyMat = new THREE.MeshBasicMaterial({
                color: 0xbef264
            });
            fireflySystem = new THREE.InstancedMesh(unitBoxGeo, fireflyMat, 120);
            fireflySystem.userData.particles = [];
            for (let i = 0; i < 120; i++) {
                fireflySystem.userData.particles.push({
                    x: (Math.random() - 0.5) * 14,
                    y: 0.8 + Math.random() * 6.5,
                    z: (Math.random() - 0.5) * 14,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.8 + Math.random() * 1.2
                });
                dummy.scale.set(0, 0, 0);
                dummy.updateMatrix();
                fireflySystem.setMatrixAt(i, dummy.matrix);
            }
            worldGroup.add(fireflySystem);
        }

        function triggerLightningStrike() {
            lightningFlash = 1.0;

            if (lightningBoltMesh) {
                worldGroup.remove(lightningBoltMesh);
                lightningBoltMesh = null;
            }

            const boltGroup = new THREE.Group();
            const boltMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
            let currX = (Math.random() - 0.5) * 8;
            let currZ = (Math.random() - 0.5) * 8;

            for (let y = 13; y >= 0.5; y -= 1.1) {
                const seg = new THREE.Mesh(unitBoxGeo, boltMat);
                seg.scale.set(0.26, 1.3, 0.26);
                currX += (Math.random() - 0.5) * 0.9;
                currZ += (Math.random() - 0.5) * 0.9;
                seg.position.set(currX, y, currZ);
                boltGroup.add(seg);
            }

            lightningBoltMesh = boltGroup;
            worldGroup.add(lightningBoltMesh);
        }

        const dummyObj = new THREE.Object3D();

        function updateWeatherParticles(dt, elapsed) {
            const activeCount = Math.floor(MAX_PARTICLES * Math.min(1, weatherIntensity / 1.5));

            // 1. Update Rain & Storm
            const isRaining = currentWeather === 'rain' || currentWeather === 'storm';
            rainSystem.visible = isRaining;
            splashSystem.visible = isRaining;

            if (isRaining) {
                const stormBoost = currentWeather === 'storm' ? 1.45 : 1.0;
                const particles = rainSystem.userData.particles;
                const tiltAngle = -windX * 0.22;

                for (let i = 0; i < MAX_PARTICLES; i++) {
                    if (i > activeCount) {
                        dummyObj.scale.set(0, 0, 0);
                        dummyObj.updateMatrix();
                        rainSystem.setMatrixAt(i, dummyObj.matrix);
                        continue;
                    }
                    const p = particles[i];
                    p.y -= p.speed * stormBoost * weatherIntensity * dt;
                    p.x += windX * 4.5 * dt;

                    if (p.y < 0.4) {
                        p.y = 13.5 + Math.random() * 2;
                        p.x = (Math.random() - 0.5) * 16;
                        p.z = (Math.random() - 0.5) * 16;
                    }
                    if (p.x > 8) p.x = -8;
                    if (p.x < -8) p.x = 8;

                    dummyObj.position.set(p.x, p.y, p.z);
                    dummyObj.rotation.set(0, 0, tiltAngle);
                    dummyObj.scale.set(0.06, 0.75 * stormBoost, 0.06);
                    dummyObj.updateMatrix();
                    rainSystem.setMatrixAt(i, dummyObj.matrix);
                }
                rainSystem.instanceMatrix.needsUpdate = true;

                // Update ground splashes
                const splashes = splashSystem.userData.splashes;
                for (let i = 0; i < splashes.length; i++) {
                    const s = splashes[i];
                    s.progress += dt * 3.2 * weatherIntensity;
                    if (s.progress >= 1.0) {
                        s.progress = 0;
                        s.x = (Math.random() - 0.5) * 14;
                        s.z = (Math.random() - 0.5) * 14;
                    }
                    const scale = Math.sin(s.progress * Math.PI) * 0.45;
                    dummyObj.position.set(s.x, 0.36, s.z);
                    dummyObj.rotation.set(0, 0, 0);
                    dummyObj.scale.set(scale, 1, scale);
                    dummyObj.updateMatrix();
                    splashSystem.setMatrixAt(i, dummyObj.matrix);
                }
                splashSystem.instanceMatrix.needsUpdate = true;
            }

            // 2. Update Snow
            snowSystem.visible = currentWeather === 'snow';
            if (snowSystem.visible) {
                const particles = snowSystem.userData.particles;
                for (let i = 0; i < MAX_PARTICLES; i++) {
                    if (i > activeCount) {
                        dummyObj.scale.set(0, 0, 0);
                        dummyObj.updateMatrix();
                        snowSystem.setMatrixAt(i, dummyObj.matrix);
                        continue;
                    }
                    const p = particles[i];
                    p.y -= p.speed * weatherIntensity * dt;
                    p.x += (windX * 2.0 + Math.sin(elapsed * 2.0 + p.phase) * 0.7) * dt;
                    p.z += Math.cos(elapsed * 1.6 + p.phase) * 0.5 * dt;

                    if (p.y < 0.3) {
                        p.y = 13.5 + Math.random() * 2;
                        p.x = (Math.random() - 0.5) * 16;
                        p.z = (Math.random() - 0.5) * 16;
                    }
                    if (p.x > 8) p.x = -8;
                    if (p.x < -8) p.x = 8;

                    dummyObj.position.set(p.x, p.y, p.z);
                    dummyObj.rotation.set(elapsed + p.phase, elapsed * 0.8, 0);
                    dummyObj.scale.set(p.size, p.size, p.size);
                    dummyObj.updateMatrix();
                    snowSystem.setMatrixAt(i, dummyObj.matrix);
                }
                snowSystem.instanceMatrix.needsUpdate = true;
            }

            // 3. Update Sakura Petals
            sakuraSystem.visible = currentWeather === 'sakura';
            if (sakuraSystem.visible) {
                const particles = sakuraSystem.userData.particles;
                const sakuraLimit = Math.floor(350 * Math.min(1, weatherIntensity));
                for (let i = 0; i < 350; i++) {
                    if (i > sakuraLimit) {
                        dummyObj.scale.set(0, 0, 0);
                        dummyObj.updateMatrix();
                        sakuraSystem.setMatrixAt(i, dummyObj.matrix);
                        continue;
                    }
                    const p = particles[i];
                    p.y -= p.speed * weatherIntensity * dt;
                    p.x += (windX * 2.8 + Math.sin(elapsed * 2.5 + p.phase) * 1.2) * dt;
                    p.z += Math.cos(elapsed * 2.0 + p.phase) * 0.9 * dt;

                    if (p.y < 0.3) {
                        p.y = 13.0 + Math.random() * 2;
                        p.x = (Math.random() - 0.5) * 16;
                        p.z = (Math.random() - 0.5) * 16;
                    }
                    if (p.x > 8) p.x = -8;
                    if (p.x < -8) p.x = 8;

                    dummyObj.position.set(p.x, p.y, p.z);
                    dummyObj.rotation.set(
                        elapsed * p.rotSpeed + p.phase,
                        elapsed * p.rotSpeed * 0.7,
                        Math.sin(elapsed + p.phase)
                    );
                    dummyObj.scale.set(0.22, 0.04, 0.16);
                    dummyObj.updateMatrix();
                    sakuraSystem.setMatrixAt(i, dummyObj.matrix);
                }
                sakuraSystem.instanceMatrix.needsUpdate = true;
            }

            // 4. Update Fireflies
            fireflySystem.visible = currentWeather === 'fireflies';
            if (fireflySystem.visible) {
                const particles = fireflySystem.userData.particles;
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    const pulse = (Math.sin(elapsed * 3.5 + p.phase) + 1) * 0.5;
                    const s = 0.08 + pulse * 0.12 * weatherIntensity;

                    p.x += Math.sin(elapsed * p.speed + p.phase) * 0.6 * dt;
                    p.y += Math.cos(elapsed * p.speed * 0.8 + p.phase) * 0.4 * dt;
                    p.z += Math.sin(elapsed * 0.7 + p.phase) * 0.6 * dt;

                    dummyObj.position.set(p.x, p.y, p.z);
                    dummyObj.rotation.set(0, 0, 0);
                    dummyObj.scale.set(s, s, s);
                    dummyObj.updateMatrix();
                    fireflySystem.setMatrixAt(i, dummyObj.matrix);
                }
                fireflySystem.instanceMatrix.needsUpdate = true;
            }
        }

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = WEATHER_PRESETS.rain.bg.clone();

            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.OrthographicCamera(
                (-frustumSize * aspect) / 2,
                (frustumSize * aspect) / 2,
                frustumSize / 2,
                -frustumSize / 2,
                -100,
                200
            );

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            worldGroup = new THREE.Group();
            worldGroup.position.y = -3.2;
            scene.add(worldGroup);

            // Lights
            ambientLight = new THREE.AmbientLight(0x94a3b8, 0.55);
            scene.add(ambientLight);

            dirLight = new THREE.DirectionalLight(0x64748b, 0.45);
            dirLight.position.set(14, 24, 12);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 65;
            const d = 16;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            // Cozy indoor & courtyard point lights
            windowLight = new THREE.PointLight(0xf59e0b, 1.4, 14);
            windowLight.position.set(-1.5, 4.5, -5.2);
            worldGroup.add(windowLight);

            lampLight = new THREE.PointLight(0xfbbf24, 1.8, 12);
            lampLight.position.set(-5.2, 3.8, 5.2);
            worldGroup.add(lampLight);

            lightningLight = new THREE.DirectionalLight(0xe0f2fe, 0);
            lightningLight.position.set(-8, 28, 10);
            scene.add(lightningLight);

            buildVoxelDiorama();
            buildVoxelClouds();
            initWeatherSystems();
            setupInteractions();
        }

        function setupInteractions() {
            const container = document.getElementById('canvas-container');

            // Mouse & Touch Orbit Controls
            container.addEventListener('mousedown', e => {
                isDragging = true;
                prevMouse.x = e.clientX;
                prevMouse.y = e.clientY;
            });

            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;
                targetAzimuth -= dx * 0.007;
                targetElevation = Math.max(0.25, Math.min(Math.PI / 2.4, targetElevation + dy * 0.006));
                prevMouse.x = e.clientX;
                prevMouse.y = e.clientY;
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            // Touch support
            container.addEventListener('touchstart', e => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    prevMouse.x = e.touches[0].clientX;
                    prevMouse.y = e.touches[0].clientY;
                }
            }, { passive: true });

            window.addEventListener('touchmove', e => {
                if (!isDragging || e.touches.length !== 1) return;
                const dx = e.touches[0].clientX - prevMouse.x;
                const dy = e.touches[0].clientY - prevMouse.y;
                targetAzimuth -= dx * 0.007;
                targetElevation = Math.max(0.25, Math.min(Math.PI / 2.4, targetElevation + dy * 0.006));
                prevMouse.x = e.touches[0].clientX;
                prevMouse.y = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', () => { isDragging = false; });

            // Wheel Zoom
            container.addEventListener('wheel', e => {
                e.preventDefault();
                targetZoom = Math.max(0.65, Math.min(1.85, targetZoom - e.deltaY * 0.001));
            }, { passive: false });

            // Weather Mode Buttons
            document.querySelectorAll('.weather-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentWeather = btn.dataset.weather;
                    if (currentWeather === 'storm') {
                        triggerLightningStrike();
                    }
                });
            });

            // Wind & Intensity Sliders
            const windSlider = document.getElementById('wind-slider');
            const windVal = document.getElementById('wind-val');
            windSlider.addEventListener('input', e => {
                windX = parseFloat(e.target.value);
                windVal.textContent = windX.toFixed(1);
            });

            const intensitySlider = document.getElementById('intensity-slider');
            const intensityVal = document.getElementById('intensity-val');
            intensitySlider.addEventListener('input', e => {
                weatherIntensity = parseFloat(e.target.value);
                intensityVal.textContent = Math.round(weatherIntensity * 100) + '%';
            });

            // Manual Lightning Strike Button
            document.getElementById('strike-btn').addEventListener('click', () => {
                triggerLightningStrike();
            });

            // Responsive Resize
            window.addEventListener('resize', () => {
                const aspect = window.innerWidth / window.innerHeight;
                camera.left = (-frustumSize * aspect) / 2;
                camera.right = (frustumSize * aspect) / 2;
                camera.top = frustumSize / 2;
                camera.bottom = -frustumSize / 2;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            // Smooth Isometric Camera Interpolation
            currentAzimuth += (targetAzimuth - currentAzimuth) * 0.08;
            currentElevation += (targetElevation - currentElevation) * 0.08;
            currentZoom += (targetZoom - currentZoom) * 0.08;

            const camDist = 36;
            camera.position.x = camDist * Math.cos(currentElevation) * Math.sin(currentAzimuth);
            camera.position.y = camDist * Math.sin(currentElevation);
            camera.position.z = camDist * Math.cos(currentElevation) * Math.cos(currentAzimuth);
            camera.lookAt(0, 0.5, 0);
            camera.zoom = currentZoom;
            camera.updateProjectionMatrix();

            // Smoothly Transition Environment Colors & Lighting
            const preset = WEATHER_PRESETS[currentWeather];
            scene.background.lerp(preset.bg, dt * 2.5);
            ambientLight.color.lerp(preset.ambientColor, dt * 2.5);
            ambientLight.intensity = THREE.MathUtils.lerp(ambientLight.intensity, preset.ambientIntensity, dt * 2.5);
            dirLight.color.lerp(preset.dirColor, dt * 2.5);
            dirLight.intensity = THREE.MathUtils.lerp(dirLight.intensity, preset.dirIntensity, dt * 2.5);
            windowLight.intensity = THREE.MathUtils.lerp(windowLight.intensity, preset.windowGlow, dt * 2.5);

            // Foliage color transitions (Green vs Sakura Pink vs Frosted)
            foliageMaterials.forEach(mat => {
                mat.color.lerp(preset.foliageColor, dt * 2.0);
            });

            // Snow Accumulation on Horizontal Surfaces & Pond Freezing
            const targetSnow = currentWeather === 'snow' ? 1.0 : 0.0;
            snowAccumulation = THREE.MathUtils.lerp(snowAccumulation, targetSnow, dt * 0.85);
            snowCaps.forEach(cap => {
                cap.mesh.material.opacity = snowAccumulation * 0.95;
                cap.mesh.scale.y = 0.02 + snowAccumulation * 0.24;
                cap.mesh.position.y = cap.baseY + (cap.mesh.scale.y / 2);
            });

            if (waterMaterial) {
                const frozenColor = new THREE.Color(0xbae6fd);
                const liquidColor = new THREE.Color(0x0ea5e9);
                waterMaterial.color.lerpColors(liquidColor, frozenColor, snowAccumulation);
                waterMaterial.roughness = THREE.MathUtils.lerp(0.15, 0.65, snowAccumulation);
            }

            // Animate Floating Voxel Clouds
            clouds.forEach((c, idx) => {
                c.group.position.x += (windX * 0.8 + c.speed * 0.35) * dt;
                if (c.group.position.x > 9) c.group.position.x = -9;
                if (c.group.position.x < -9) c.group.position.x = 9;
                c.group.position.y = c.baseY + Math.sin(elapsed * 1.4 + idx) * 0.22;
                c.material.color.lerp(preset.cloudColor, dt * 2.5);
                c.material.opacity = THREE.MathUtils.lerp(c.material.opacity, preset.cloudOpacity, dt * 2.5);
            });

            // Random Storm Lightning & Flash Decay
            if (currentWeather === 'storm' && Math.random() < 0.008 * weatherIntensity) {
                triggerLightningStrike();
            }

            if (lightningFlash > 0) {
                lightningFlash = Math.max(0, lightningFlash - dt * 3.8);
                lightningLight.intensity = lightningFlash * 4.5;
                if (lightningFlash < 0.2 && lightningBoltMesh) {
                    worldGroup.remove(lightningBoltMesh);
                    lightningBoltMesh = null;
                }
            } else {
                lightningLight.intensity = 0;
            }

            // Update Particle Systems
            updateWeatherParticles(dt, elapsed);

            renderer.render(scene, camera);
        }

        window.onload = function () {
            init();
            animate();
        };
    </script>
</body>
</html>
